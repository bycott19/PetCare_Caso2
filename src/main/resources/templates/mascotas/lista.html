<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="es">
<head th:replace="~{fragments/layout :: head('Mascotas')}"></head>
<body>
<header th:replace="~{fragments/layout :: header('mascotas')}"></header>
<main>
    <th:block th:replace="~{fragments/layout :: alertas}"></th:block>
    <div class="page-head">
        <div class="ph-title">
            <span class="tile mint"><svg th:replace="~{fragments/icons :: paw}"></svg></span>
            <div>
                <h1>Mascotas</h1>
            </div>
        </div>
        <div class="acciones">
            <a th:href="@{/mascotas/nueva(clienteId=${clienteId})}" class="btn">+ Agregar mascota</a>
        </div>
    </div>
    <div class="card filtros">
        <form th:action="@{/mascotas}" method="get" class="card-tools">
            <select name="clienteId" class="in" onchange="this.form.submit()">
                <option value="">Todos los dueños</option>
                <option th:each="c : ${clientes}" th:value="${c.id}" th:text="${c.nombre}"
                        th:selected="${clienteId != null and clienteId == c.id}">Cliente</option>
            </select>
            <div class="buscador">
                <svg th:replace="~{fragments/icons :: search}"></svg>
                <input type="text" name="q" th:value="${q}" class="in" placeholder="Buscar por nombre, especie, raza o dueño">
            </div>
            <button type="submit" class="btn o">Buscar</button>
            <a th:if="${clienteId != null or (q != null and !#strings.isEmpty(q))}" th:href="@{/mascotas}" class="btn o">Limpiar</a>
            <span class="tag ok contador" th:text="${#lists.size(mascotas)} + ' mascota(s)'">0</span>
        </form>
    </div>
    <div class="card vacio-card" th:if="${#lists.isEmpty(mascotas)}">
        <span class="tile mint"><svg th:replace="~{fragments/icons :: paw}"></svg></span>
        <h3>No hay mascotas para mostrar</h3>
        <a th:href="@{/mascotas/nueva}" class="btn p">+ Agregar mascota</a>
    </div>
    <div class="cards" th:unless="${#lists.isEmpty(mascotas)}">
        <div class="card pet-card" th:each="m : ${mascotas}">
            <div class="pet-head">
                <span class="av big" th:classappend="${m.tipo}"><svg th:replace="~{fragments/icons :: paw}"></svg></span>
                <div>
                    <h3 th:text="${m.nombre}">Luna</h3>
                    <div class="sub" th:text="${m.especie} + ' · ' + ${m.raza}">Perro · Mestiza</div>
                </div>
            </div>
            <dl class="stats">
                <div><dt>Edad</dt><dd th:text="${m.edad}">2 años</dd></div>
                <div><dt>Peso</dt><dd th:text="${m.peso.stripTrailingZeros().toPlainString()} + ' kg'">12.5 kg</dd></div>
                <div><dt>Nacimiento</dt><dd th:text="${#temporals.format(m.fechaNacimiento, 'dd/MM/yyyy')}">01/01/2022</dd></div>
            </dl>
            <div class="pet-foot">
                <div class="sub">Dueño: <a th:href="@{/clientes/{id}(id=${m.clienteId})}" class="enlace" th:text="${m.clienteNombre}">Dueño</a></div>
                <div class="btn-row">
                    <a th:href="@{/reservas/nueva(mascotaId=${m.id})}" class="btn p sm">+ Pedir hora</a>
                    <a th:href="@{/mascotas/{id}/editar(id=${m.id})}" class="btn o sm">Editar</a>
                    <form th:action="@{/mascotas/{id}/eliminar(id=${m.id})}" method="post"
                          onsubmit="return confirm('¿Seguro que deseas eliminar esta mascota?')">
                        <input type="hidden" name="volver" value="/mascotas">
                        <button type="submit" class="btn danger sm">Eliminar</button>
                    </form>
                </div>
            </div>
        </div>
    </div>
</main>
</body>
</html>
