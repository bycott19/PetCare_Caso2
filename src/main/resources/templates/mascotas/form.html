<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="es">
<head th:replace="~{fragments/layout :: head(${mascota.id == null ? 'Nueva mascota' : 'Editar mascota'})}"></head>
<body>
<header th:replace="~{fragments/layout :: header('mascotas')}"></header>
<main>
    <div class="page-head">
        <div class="ph-title">
            <span class="tile mint"><svg th:replace="~{fragments/icons :: pencil}"></svg></span>
            <div>
                <h1 th:text="${mascota.id == null} ? 'Nueva mascota' : 'Editar mascota'">Nueva mascota</h1>
            </div>
        </div>
        <div class="acciones">
            <a th:href="${mascota.clienteId != null} ? @{/clientes/{id}(id=${mascota.clienteId})} : @{/mascotas}" class="btn o">
                <svg th:replace="~{fragments/icons :: arrow}"></svg>Volver</a>
        </div>
    </div>
    <div class="form-layout">
        <div class="card">
            <form th:action="@{/mascotas/guardar}" th:object="${mascota}" method="post" novalidate>
                <input type="hidden" th:field="*{id}">
                <div class="dos">
                    <div class="campo">
                        <label for="clienteId">Dueño / Dueña</label>
                        <select th:field="*{clienteId}" class="fld" th:classappend="${#fields.hasErrors('clienteId')} ? 'bad'">
                            <option value="">-- Elige un cliente --</option>
                            <option th:each="c : ${clientes}" th:value="${c.id}" th:text="${c.nombre} + ' · ' + ${c.rut}">Cliente</option>
                        </select>
                        <div class="err" th:if="${#fields.hasErrors('clienteId')}" th:errors="*{clienteId}"></div>
                    </div>
                    <div class="campo">
                        <label for="nombre">Nombre de la mascota</label>
                        <input type="text" th:field="*{nombre}" class="fld" th:classappend="${#fields.hasErrors('nombre')} ? 'bad'"
                               placeholder="Ej: Luna">
                        <div class="err" th:if="${#fields.hasErrors('nombre')}" th:errors="*{nombre}"></div>
                    </div>
                </div>
                <div class="dos">
                    <div class="campo">
                        <label for="especie">Especie</label>
                        <input type="text" th:field="*{especie}" list="especies" class="fld"
                               th:classappend="${#fields.hasErrors('especie')} ? 'bad'" placeholder="Perro, Gato...">
                        <datalist id="especies">
                            <option value="Perro"></option>
                            <option value="Gato"></option>
                            <option value="Conejo"></option>
                            <option value="Hámster"></option>
                            <option value="Ave"></option>
                            <option value="Tortuga"></option>
                            <option value="Pez"></option>
                        </datalist>
                        <div class="err" th:if="${#fields.hasErrors('especie')}" th:errors="*{especie}"></div>
                    </div>
                    <div class="campo">
                        <label for="raza">Raza</label>
                        <input type="text" th:field="*{raza}" class="fld" th:classappend="${#fields.hasErrors('raza')} ? 'bad'"
                               placeholder="Ej: Mestiza">
                        <div class="err" th:if="${#fields.hasErrors('raza')}" th:errors="*{raza}"></div>
                    </div>
                </div>
                <div class="dos">
                    <div class="campo">
                        <label for="fechaNacimiento">Fecha de nacimiento</label>
                        <input type="date" th:field="*{fechaNacimiento}" class="fld"
                               th:attr="max=${#temporals.format(#temporals.createToday(), 'yyyy-MM-dd')}"
                               th:classappend="${#fields.hasErrors('fechaNacimiento')} ? 'bad'">
                        <div class="err" th:if="${#fields.hasErrors('fechaNacimiento')}" th:errors="*{fechaNacimiento}"></div>
                    </div>
                    <div class="campo">
                        <label for="peso">Peso (kg)</label>
                        <input type="number" step="0.001" min="0.001" th:field="*{peso}" class="fld"
                               th:classappend="${#fields.hasErrors('peso')} ? 'bad'" placeholder="Ej: 12.5">
                        <div class="err" th:if="${#fields.hasErrors('peso')}" th:errors="*{peso}"></div>
                    </div>
                </div>
                <div class="form-actions">
                    <a th:href="${mascota.clienteId != null} ? @{/clientes/{id}(id=${mascota.clienteId})} : @{/mascotas}" class="btn o">Cancelar</a>
                    <button type="submit" class="btn p">Guardar mascota</button>
                </div>
            </form>
        </div>
    </div>
</main>
</body>
</html>
