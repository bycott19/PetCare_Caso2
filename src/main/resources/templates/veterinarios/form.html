<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="es">
<head th:replace="~{fragments/layout :: head(${veterinario.id == null ? 'Nuevo veterinario' : 'Editar veterinario'})}"></head>
<body>
<header th:replace="~{fragments/layout :: header('veterinarios')}"></header>
<main>
    <div class="page-head">
        <div class="ph-title">
            <span class="tile sky"><svg th:replace="~{fragments/icons :: pencil}"></svg></span>
            <div>
                <h1 th:text="${veterinario.id == null} ? 'Nuevo veterinario' : 'Editar veterinario'">Nuevo veterinario</h1>
            </div>
        </div>
        <div class="acciones">
            <a th:href="@{/veterinarios}" class="btn o"><svg th:replace="~{fragments/icons :: arrow}"></svg>Volver</a>
        </div>
    </div>
    <div class="form-layout">
        <div class="card">
            <form th:action="@{/veterinarios/guardar}" th:object="${veterinario}" method="post" novalidate>
                <input type="hidden" th:field="*{id}">
                <div class="campo">
                    <label for="nombre">Nombre completo</label>
                    <input type="text" th:field="*{nombre}" class="fld" th:classappend="${#fields.hasErrors('nombre')} ? 'bad'"
                           placeholder="Ej: Dra. Valentina Pérez">
                    <div class="err" th:if="${#fields.hasErrors('nombre')}" th:errors="*{nombre}"></div>
                </div>
                <div class="form-actions">
                    <a th:href="@{/veterinarios}" class="btn o">Cancelar</a>
                    <button type="submit" class="btn p">Guardar</button>
                </div>
            </form>
        </div>
    </div>
</main>
</body>
</html>
