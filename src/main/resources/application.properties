spring.application.name=PetCare_Caso2
server.port=8081
petcare.api.base-url=${PETCARE_API_BASE_URL:http://localhost:3000}

spring.config.import=optional:file:.env[.properties]
spring.datasource.url=jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:petcare}
spring.datasource.username=${DB_USER:postgres}
spring.datasource.password=${DB_PASSWORD:postgres}
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.sql.init.mode=never

petcare.api.url=${PETCARE_API_URL:http://localhost:3000}
